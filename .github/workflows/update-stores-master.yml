name: Update Stores Master (weekly safety net)

# 店舗マスタの通常更新は日次ジョブ（daily-fetch.yml → index.js → sync-stores-master.js）が
# 公式APIと同期して行う。このワークフローは日次が何日も落ちていた場合の保険として
# 同じ同期を週1回走らせるだけ。
# ※以前はここで update-stores-master.js（POS画面のPlaywright走査）が
#   マスタを書いていたが、画面のプルダウン表記が公式APIより遅れるため
#   同期済みのマスタを古い名前で上書きしてしまう。書き手は公式APIに一本化した。
#   update-stores-master.js は API が使えないときの手動フォールバックとして残置。

on:
  schedule:
    # 毎週日曜 00:00 UTC = 09:00 JST
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync stores master from STORES official API
        env:
          STORES_RETAIL_TOKEN: ${{ secrets.STORES_RETAIL_TOKEN }}
        run: node sync-stores-master.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/stores_master.json)" ]; then
            git add data/stores_master.json
            git commit -m "chore: sync stores_master.json from STORES API (weekly safety net)"
            git pull --rebase --autostash origin main || true
            git push
            echo "✅ stores_master.json を更新しました"
          else
            echo "ℹ️ 差分なし、コミットスキップ"
          fi
